# Tambahan reverse proxy HTTPS otomatis (Caddy + Let's Encrypt) untuk produksi VPS.
# Jalankan: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
services:
  backend:
    ports: []

  web:
    ports: []

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
